name: Nightly E2E (live Foundry)

# Slow tier: downloads a real Foundry build and drives it through Docker.
# Needs foundryvtt.com credentials, so this runs on a self-hosted runner only —
# those credentials live in a local, gitignored env file on that machine
# (relay/.env.test.docker), never in GitHub Secrets or the repo. See
# relay/scripts/test-docker.sh for what it actually does.

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily
  workflow_dispatch: {}   # manual trigger from the Actions tab

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run live Foundry + relay integration suite
        working-directory: relay
        run: bash ./scripts/test-docker.sh 13
        env:
          ENV_FILE: ${{ github.workspace }}/relay/.env.test.docker
          # Sibling checkout of the REST API module this stack loads into
          # Foundry — lives outside the runner's workspace on this machine.
          MODULE_PATH: /Users/ckennedy/Projects/foundryvtt-rest-api
