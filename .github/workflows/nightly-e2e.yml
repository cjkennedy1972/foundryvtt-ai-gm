name: Nightly E2E (live Foundry)

# Slow tier: downloads a real Foundry build and drives it through Docker.
# Needs foundryvtt.com credentials (repo secrets FOUNDRY_USERNAME / FOUNDRY_PASSWORD),
# so this runs on the self-hosted runner x86-localai01 only. The credentials are
# written to relay/.env.test.docker for the run and deleted afterwards. See
# relay/scripts/test-docker.sh for what it actually does.

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily
  workflow_dispatch: {}   # manual trigger from the Actions tab

# Least privilege: without this, jobs get the default broad token scope
# (CodeQL actions/missing-workflow-permissions). Nothing here writes to
# the repo — the checks only read code and report status.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: [self-hosted, x86-localai01]
    timeout-minutes: 60
    env:
      ENV_FILE: ${{ github.workspace }}/relay/.env.test.docker
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The REST API module this stack loads into Foundry. Tracks upstream
      # main — the same source end users install from.
      - uses: actions/checkout@v4
        with:
          repository: ThreeHats/foundryvtt-rest-api
          path: foundryvtt-rest-api

      - name: Install module dependencies
        working-directory: foundryvtt-rest-api
        run: npm install --no-audit --no-fund

      - name: Write credentials env file
        run: |
          umask 077
          cat > "$ENV_FILE" <<EOF
          FOUNDRY_USERNAME=${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD=${{ secrets.FOUNDRY_PASSWORD }}
          EOF

      - name: Run live Foundry + relay integration suite
        working-directory: relay
        run: |
          set +e
          LOG_FILE="$(mktemp)"
          bash ./scripts/test-docker.sh 13 2>&1 | tee "$LOG_FILE"
          EXIT_CODE=${PIPESTATUS[0]}

          # Retry only when the headless session waited on something that never
          # arrived — a second attempt can plausibly clear that. Matching on the
          # /start-session test name instead would also swallow deterministic
          # failures (a stale DOM selector, a world-config mismatch), which
          # report a specific reason and must go red on the first run. Default
          # is no retry: an unrecognised failure fails the build.
          TRANSIENT='timed out waiting for headless session'
          TRANSIENT="$TRANSIENT|client connection timed out after"
          TRANSIENT="$TRANSIENT|game canvas did not load"
          TRANSIENT="$TRANSIENT|seeded headless client did not register within"

          if [ "$EXIT_CODE" -ne 0 ] && grep -qE "$TRANSIENT" "$LOG_FILE"; then
            echo "Transient headless-session failure; retrying the e2e suite once..."
            bash ./scripts/test-docker.sh 13
            exit $?
          fi

          exit "$EXIT_CODE"
        env:
          MODULE_PATH: ${{ github.workspace }}/foundryvtt-rest-api
          # Leave the stack up for the fidelity check below; the teardown step
          # at the end of this job removes it either way.
          KEEP_RUNNING: 1

      # tests/fake_relay.py imitates the relay for the engine's unit tests, and
      # test_fake_relay_matches_the_real_one checks its protocol constants
      # against a real one — but only when LIVE_RELAY_WS is set, and nothing
      # set it anywhere, so the double was unverified in exactly the way #221
      # and #222 were about. This job has a relay for the length of the run,
      # which makes it the one place the check can happen.
      - name: Check the relay double still matches the real relay
        if: always()
        working-directory: ai-engine
        env:
          MODEL: test-model
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3010/api/health >/dev/null

          # test-docker.sh seeds this admin. The key it mints is a master key,
          # which is what the WebSocket auth path takes.
          KEY=$(curl -fsS -X POST http://localhost:3010/auth/regenerate-key \
                  -H 'Content-Type: application/json' \
                  -d '{"email":"admin@test.local","password":"AdminTestPass1"}' \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["apiKey"])')

          LIVE_RELAY_WS=ws://localhost:3010/ws/api LIVE_RELAY_KEY="$KEY" \
            python3 -m pytest tests/test_fake_relay_matches_the_real_one.py -v

      - name: Tear down the stack
        if: always()
        working-directory: relay
        run: docker compose -f docker-compose.test.yml down -v || true

      - name: Remove credentials env file
        if: always()
        run: rm -f "$ENV_FILE"
