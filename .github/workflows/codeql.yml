name: CodeQL

# Advanced setup, replacing GitHub's default setup. The move buys two things
# default setup cannot express: a config file (so the path-injection barriers
# in .github/codeql/extensions are paired with explicit path exclusions), and
# control over which languages run and when.
#
# Language list matches what default setup had configured: actions,
# javascript-typescript (which covers both javascript and typescript), and
# python.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, matching the cadence default setup used.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload results to the code-scanning API.
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          category: "/language:${{ matrix.language }}"
