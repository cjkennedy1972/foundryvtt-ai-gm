name: CI

# Fast tier: runs on every push and PR against GitHub-hosted runners.
# No live Foundry needed, no credentials required.
#
# See: https://github.com/cjkennedy1972/foundryvtt-ai-gm/pull/107

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: without this, jobs get the default broad token scope
# (CodeQL actions/missing-workflow-permissions). Nothing here writes to
# the repo — the checks only read code and report status.
permissions:
  contents: read

jobs:
  ai-engine-tests:
    runs-on: ubuntu-latest
    # A wedged pytest used to hold this job for hours and leave every PR
    # showing "pending" (CKP-139). The suite runs in ~2 min; 15 turns a hang
    # into a fast, readable failure.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: ai-engine

      # Lint before the suite: a NameError in an untested branch is exactly
      # what F821 catches and pytest does not. Config in ai-engine/ruff.toml.
      - run: ruff check .
        working-directory: ai-engine

      - run: pytest -q --cov
        working-directory: ai-engine
        env:
          # config.Settings validates model is non-empty at import time (fails
          # fast against real misconfiguration); tests never call a real LLM,
          # so any placeholder satisfies it. No .env file exists in CI.
          MODEL: test-model

  admin-panel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
        working-directory: ai-engine/admin-panel

      # Vitest over the panel's logic layer (store, fetch wrapper, config,
      # hooks) and every page and component that has a test, with coverage
      # thresholds enforced in vite.config.js. Only the ReactDOM bootstrap
      # (src/main.jsx) is outside the measured set.
      - run: npm test
        working-directory: ai-engine/admin-panel

      - run: npm run build
        working-directory: ai-engine/admin-panel

  # The control panel's node:test suite (36 tests) shipped with the
  # ApplicationV2 rebuild but no job ever ran it, so it could rot silently.
  # It needs no install: the tests import the module's own .mjs sources and
  # use only node:test and node:assert.
  foundry-module-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node --test "tests/**/*.test.mjs"
        working-directory: foundry-module
