# Model pack teaching CodeQL that this project's two path helpers are barriers.
#
# Without it, py/path-injection reports 35 alerts across the campaign asset
# pipeline. Every one traces back to sanitize_filename or
# validate_contained_path, usually a call or two away, which is further than
# the default taint tracking follows. The alerts are all false positives (see
# PR #169 for the site-by-site triage), and that volume of known-good noise is
# what stops a real path-injection finding from standing out.
#
# Packs under .github/codeql/extensions are picked up automatically by both
# default and advanced setup.
name: aigm/python-sanitizers
version: 0.1.0
library: true
extensionTargets:
  codeql/python-all: "*"
dataExtensions:
  - models/**/*.yml
